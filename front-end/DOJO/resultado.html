<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resultado do Aluno</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card resultado-card">

            <div class="cabecalho">

                <p class="subtitulo">RESULTADO FINAL</p>

                <h1>Resultado do aluno</h1>
            </div>

            <div class="resultado-conteudo">

                <p class="texto-nome">
                    Aluno
                </p>

                <h2 id="nomeAluno"></h2>

                <div class="resultado-media">

                    <span>Média final</span>

                    <strong id="mediaAluno"></strong>

                </div>

                <div class="situacao" id="situacao">
                    <span id="resultadoAluno"></span>
                </div>

            </div>

            <a href="index.html" class="voltar">
                ← Fazer novo registro
            </a>

        </section>

    </main>

    <script src="resultado.js"></script>

</body>

</html>

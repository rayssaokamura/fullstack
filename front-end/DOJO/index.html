<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Notas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="cabecalho">

                <h1>Registro de Notas</h1>

                <p class="descricao">
                    Preencha os dados do aluno e acompanhe a média.
                </p>
            </div>

            <form id="formulario">

                <div class="campo">
                    <label for="nome">Nome do aluno</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome completo"
                        required
                    >
                </div>

                <div class="notas">

                    <div class="campo">
                        <label for="nota1">Nota 1</label>

                        <input
                            type="number"
                            id="nota1"
                            min="0"
                            max="10"
                            step="0.1"
                            placeholder="0,0"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="nota2">Nota 2</label>

                        <input
                            type="number"
                            id="nota2"
                            min="0"
                            max="10"
                            step="0.1"
                            placeholder="0,0"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="nota3">Nota 3</label>

                        <input
                            type="number"
                            id="nota3"
                            min="0"
                            max="10"
                            step="0.1"
                            placeholder="0,0"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="nota4">Nota 4</label>

                        <input
                            type="number"
                            id="nota4"
                            min="0"
                            max="10"
                            step="0.1"
                            placeholder="0,0"
                            required
                        >
                    </div>

                </div>

                <div class="media-box">

                    <div>
                        <span>Média atual</span>
                        <small>Atualizada automaticamente</small>
                    </div>

                    <strong id="media">--</strong>

                </div>

                <button type="submit">
                    Registrar resultado
                    <span>→</span>
                </button>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
